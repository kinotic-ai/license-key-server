# The test suite's server: ports that clash with neither a development server nor a second suite's node,
# a signing key supplied by each test, and email logged rather than sent.
kinotic:
  ignite:
    discoveryPort: 47610
    communicationPort: 47210
    workDirectory: /tmp/license-key-server-ignite-test
  apiGateway:
    stompPort: 58603
  cors:
    # the two sites, and the gateway's own origin, which kinotic-client's WebSocket upgrade sends as Kinotic's does
    allowedOriginPattern: "http:\\/\\/localhost:(5173|5174|58603)"
    allowCredentials: true
  licenses:
    ephemeralSigningKey: true
    publicBaseUrl: http://localhost:5173
    staffBaseUrl: http://localhost:5174
    stripe:
      secretKey: sk_test_placeholder
      webhookSecret: whsec_test_placeholder
    email:
      enabled: false
    staffOidc:
      issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
      clientId: test-client
      clientSecret: test-secret
      allowedEmailDomain: mindsignited.com

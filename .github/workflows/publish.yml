# Builds the server's image and pushes it to the organization's private ghcr.io package, which the hosts that run
# it pull with a read:packages token: :main follows the default branch, :sha-<commit> names each build.
name: Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kinotic-ai/license-key-server:sha-${{ github.sha }}
            ${{ github.ref_name == 'main' && 'ghcr.io/kinotic-ai/license-key-server:main' || '' }}
          # Links the package to this repository, so it takes the repository's access
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
